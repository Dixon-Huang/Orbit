<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a0d24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Orbit</title>
<style id="css">
:root{--st:env(safe-area-inset-top);--hb:0px;--sb:max(env(safe-area-inset-bottom),20px);--bg:#0a0d24;--card:rgba(24,27,72,.74);--solid:#15183f;--ink:#f6f2e6;--mute:#a4a1d0;--line:rgba(255,241,214,.13);--acc:#ffb38a;--acc2:rgba(255,179,138,.14);--bad:#ff7b72;--bad2:rgba(255,123,114,.16);--warn:#ffd08a;--warn2:rgba(240,181,74,.14);--h1:rgba(255,179,138,.18);--h2:rgba(255,179,138,.38);--h3:rgba(255,179,138,.64);--h4:#ffb38a;--g1:#1d3a2d;--g2:#2c5a40;--g3:#3f8a60;--g4:#6cc497;--seg:rgba(255,241,214,.08);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(130% 70% at 85% -10%,#2c2266 0%,#141a48 38%,#0a0d24 78%) fixed,var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
#scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
h1{font-size:30px;margin:0;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;letter-spacing:.06em;color:#fff7e6}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#scroller{z-index:1}
.hdr{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.hdr+.sub{margin-top:-12px}
.hdr h1{flex:1}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.iconbtn{border:none;background:var(--acc2);color:var(--acc);height:34px;min-width:34px;padding:0 12px;border-radius:17px;font-size:15px;font-weight:600;cursor:pointer}
.subhdr{display:flex;align-items:center;margin:2px 0 16px;min-height:34px}
.subhdr .back{border:none;background:none;color:var(--acc);font-size:16px;padding:6px 0;cursor:pointer;width:72px;text-align:left}
.subhdr h2{flex:1;text-align:center;margin:0;font-size:17px}
.subhdr .sp{width:72px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600}
.sect{font-size:13px;color:var(--mute);font-weight:600;margin:18px 4px 6px}
.node{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.node:first-of-type{border-top:none}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;cursor:pointer;margin-top:1px}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk:disabled{opacity:.4}
.nb{flex:1;min-width:0}
.nm{font-weight:600}
.cr{color:var(--mute);font-size:13px}
.meta{color:var(--mute);font-size:12px;margin-top:2px}
.branch{color:var(--mute);opacity:.5;font-family:ui-monospace,monospace;margin-right:2px}
.fail{flex:none;border:none;background:none;color:var(--mute);font-size:13px;padding:6px 4px;cursor:pointer}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
button.btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.pri{background:linear-gradient(135deg,#f09a74,#c9603f);color:#fff;box-shadow:0 4px 14px rgba(232,143,108,.28)}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn2);color:var(--warn)}
.banner.pause{background:var(--acc2);color:var(--acc)}
.rev{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(0,0,0,.06)}
.rev:first-of-type{border-top:none}
.rev span{flex:1}
.rev button{border:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.ok{background:linear-gradient(135deg,#f09a74,#c9603f);color:#fff}.no{background:var(--bad);color:#fff}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:2px;margin:6px 0 14px}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:8px;padding:13px 16px;border:none;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;font-size:16px;color:var(--ink);text-align:left}
.lrow:first-child{border-top:none}
.lrow span{flex:1}
.lrow .v{color:var(--mute);font-size:14px;flex:none}
.lrow:after{content:'›';color:var(--mute);font-size:20px;line-height:1}
.lrow.noarrow:after{content:''}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(var(--sb) + 4px);z-index:4}
.tabs button{flex:1;border:none;background:none;font-size:11px;color:var(--mute);padding:4px;cursor:pointer}
.tabs button .i{display:block;font-size:21px;line-height:1.3}
.tabs button.act{color:var(--acc);font-weight:600}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 70px);background:var(--acc);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;z-index:5;white-space:nowrap}
.hist{font-size:14px;padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.hist:first-of-type{border-top:none}
.hist .d{color:var(--mute);font-size:12px;flex:none;width:78px}
.hist .t{flex:1}
.hist button{border:none;background:var(--acc2);color:var(--acc);border-radius:8px;font-size:12px;padding:4px 8px;cursor:pointer;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;margin:0 6px 6px 0}
.tag button{border:none;background:none;color:var(--mute);font-size:15px;cursor:pointer;padding:0}
.rules p{margin:6px 0;font-size:15px}
.seat{border-top:1px solid var(--line);padding:12px 0}
.seat:first-of-type{border-top:none;padding-top:2px}
.seat .top{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.num{font-size:22px;font-weight:700}
.veh{font-size:20px;letter-spacing:1px;margin:2px 0 8px;word-break:break-all;min-height:28px}
.exn{font-size:12px;color:var(--mute);margin-top:6px}
.timer{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.ring{position:relative;width:210px;height:210px;margin:4px auto 10px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:44px;font-variant-numeric:tabular-nums}
.ring .t span{font-size:13px;color:var(--mute)}
.tomato{font-size:18px;text-align:center;letter-spacing:2px;min-height:26px;margin-bottom:6px}
.calnav{display:flex;align-items:center;margin-bottom:10px}
.calnav b{flex:1;text-align:center;font-size:16px}
.calnav button{border:none;background:none;font-size:24px;color:var(--acc);padding:0 12px;cursor:pointer;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border:none;border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1.15}
.cal button small{font-size:10px;font-weight:600}
.cal .lv1{background:var(--h1)}.cal .lv2{background:var(--h2)}.cal .lv3{background:var(--h3);color:#fff}.cal .lv4{background:var(--h4);color:#1a1b4b}
.cal .mk{outline:1.5px dashed var(--mute);outline-offset:-3px}
.tcal{padding:8px 10px}
.tw{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding:6px 0 8px;border-top:1px solid var(--line)}
.tw.th{border-top:none;padding:0 0 4px}
.tw.th small{text-align:center;font-size:11px;color:var(--mute)}
.tdy{text-align:center;font-size:15px;font-weight:600;padding-bottom:3px}
.tdy b{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%}
.tdy.now b{background:#e5484d;color:#fff}
.tdy.past{opacity:.35}
.tb{height:6px;border-radius:3px;margin:0 2px;cursor:pointer;display:block}
.tb.od{outline:2px solid var(--bad);outline-offset:1px}
.bar.mk10{position:relative;overflow:visible}
.bar.mk10:after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.bar.mk10 i{border-radius:4px}
.lk:disabled{opacity:.35}
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink);margin:0}
.ck input{width:20px;height:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#1a1b4b}
.mv{margin-left:auto;display:inline-flex;gap:14px;margin-right:14px}
.mv .lk{font-size:16px;padding:0 4px}
.mv.v{flex-direction:column;gap:2px;margin:0 0 0 10px}
.gex.pl{display:flex;align-items:center}
.spk{border:none;background:none;padding:0 4px;cursor:pointer;flex:none;width:64px;height:28px;display:flex;align-items:center;justify-content:center}
.spk .cr{font-size:12px}
.pw{flex:none;width:58px;text-align:right;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;cursor:pointer}
.gex{padding:10px 0;border-top:1px solid var(--line)}
.gex:first-of-type{border-top:none}
.gex .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grow{display:flex;gap:6px;margin-top:8px;align-items:center}
.grow input{padding:8px 4px;text-align:center;font-size:16px}
.gw{flex:1.5;position:relative;display:block}
.gw input{padding-right:22px}
.gw small{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mute)}
.gr{flex:1;min-width:0}
.hrow{padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:none}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.cal .td{box-shadow:inset 0 0 0 2px var(--acc)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--bg)}
.yr{display:flex;gap:4px;align-items:flex-end;height:70px}
.yr button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;padding:0;cursor:pointer;font-size:10px;color:var(--mute);gap:3px}
.yr i{display:block;width:72%;background:var(--h3);border-radius:3px 3px 0 0;min-height:2px}
.yr button.on{color:var(--acc);font-weight:700}
.yr button.on i{background:var(--acc)}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:12px;color:var(--mute)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 8px)}
.dlg{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:74vh;overflow:auto}
.dueseg button small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.dueseg button.on small{color:var(--acc)}
.dnrow{align-items:center;justify-content:center;gap:18px;margin-top:10px}
.dnrow .btn{width:52px;padding:8px 0;font-size:20px;flex:none}
.dnrow span{font-size:15px;min-width:70px;text-align:center}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--mute);font-size:14px}
.dlg ul{margin:0 0 14px;padding-left:20px}
.dlg .row{margin-top:10px}
.drow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.drow:first-of-type{border-top:none}
.drow .k{color:var(--mute);width:40px;flex:none}
.journey .jtop{display:flex;align-items:center}
.journey .jtop>div:first-child{flex:1}
.thr{color:var(--acc)}
.iconbtn.gear{background:none;color:var(--mute);padding:0;display:flex;align-items:center;justify-content:center}
.chk.num{color:#c9703f;font-size:12px;font-weight:700}
.trow{align-items:center}
.trow.dim{opacity:.45}
.trow .meta{margin-top:2px}
.banner.linkb{display:flex;justify-content:space-between;width:100%;border:none;font-family:inherit;text-align:left;cursor:pointer}
.iconbtn.gear{position:relative}
.iconbtn.gear.dot:after{content:'';position:absolute;top:4px;right:2px;width:8px;height:8px;border-radius:50%;background:#d9682b}
.lk.more{display:block;width:100%;text-align:center;padding:10px 0 0;margin-top:4px;border-top:1px solid var(--line)}
.btn.pri.small .thb{color:#ffd9bf}
.thb{font-size:11px;font-weight:700;color:#c9703f;margin-left:4px;white-space:nowrap}
.btn.pri .thb{color:#ffd9bf}
.nm .thb{vertical-align:1px}
#toast .thr{color:#ffb38a}
.space{background:radial-gradient(120% 90% at 85% 0%,#3a2a78 0%,#1a1b4b 42%,#0c1030 100%);border-color:#2b2f66;color:#fff1d6;position:relative;overflow:hidden}
.star{cursor:pointer;padding:0 0 14px}
.scene{display:block;width:100%;height:auto;aspect-ratio:340/150}
.orb{overflow:visible}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 16px;margin-top:-6px}
.shead small{display:block;font-size:12px;color:#a9a6d6;margin-bottom:2px}
.shead h2{margin:0;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:28px;font-weight:700;letter-spacing:.04em;color:#fff7e6;line-height:1.15}
.sprog{font-size:13px;color:#a9a6d6;white-space:nowrap;padding-bottom:4px;font-variant-numeric:tabular-nums}
.sprog b{font-size:20px;color:#fff1d6}
.seq{display:flex;align-items:flex-end;justify-content:space-between;gap:2px;margin:14px 16px 0;padding-top:12px;border-top:1px solid rgba(255,241,214,.14)}
.seq span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#a9a6d6;min-width:0}
.seq span b{font-size:17px;color:#fff1d6;font-weight:700;font-variant-numeric:tabular-nums}
.seq span.off b{color:#6f6da0;font-weight:500}
.seq span.drag b{color:#ff8f7a}
.seq span.tot b{color:#ffb38a;font-size:22px}
.seq em{font-style:normal;color:#6f6da0;font-size:13px;padding-bottom:14px}
.chg{margin:10px 16px 0;font-size:12px;color:#9fe9ff}
.dlg.space{padding:0 0 16px}
.dlg.space .row{padding:0 16px}
.scard{position:relative;text-align:center;padding:26px 22px 4px}
.scard .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scard .art{position:relative;height:190px;display:flex;align-items:center;justify-content:center;animation:arrive .9s cubic-bezier(.2,.8,.2,1) both}
.scard .stag{position:relative;font-size:13px;color:#ffb38a;letter-spacing:.2em;margin-top:6px}
.scard h3{position:relative;margin:4px 0 12px;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:32px;letter-spacing:.06em;color:#fff7e6}
.scard p{position:relative;text-align:left;color:#d6d2f2;font-size:15px;line-height:1.7;margin:0 0 6px}
@keyframes arrive{from{transform:scale(.35) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scard .art{animation:none}}
.btn.glow{background:#fff1d6;color:#1a1b4b;font-weight:700}
.pickwrap{padding-bottom:10px}
.picks{position:relative;display:flex;gap:12px;margin-top:14px}
.picks button{flex:1;background:rgba(255,241,214,.06);border:1px solid rgba(255,241,214,.22);border-radius:16px;padding:14px 4px 12px;color:#fff7e6;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.picks b{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:19px;letter-spacing:.05em}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.sgrid button{border:none;background:none;color:#d6d2f2;padding:2px 0;font-size:11px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
.sgrid button b{font-weight:500;white-space:nowrap}
.sgrid button i{width:34px;height:34px;margin-top:10px;border-radius:50%;border:1.2px dashed rgba(255,241,214,.22)}
.sgrid button.on{cursor:pointer}
.sgrid button.tg .orb{opacity:.45}
.sgrid button.tg b{color:#ffb38a}
.fleetrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px}
.fleetrow button{border:none;background:none;color:#8b88bd;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:0}
.fleetrow button i{width:30px;height:30px;margin:27px 0;border-radius:50%;border:1.2px dashed rgba(255,241,214,.22)}
.fleetrow b{font-weight:500}
.fleetrow small{font-size:11px;color:#6f6da0}
.fleetrow .got{color:#d6d2f2;cursor:pointer}
.fleetrow .cur{color:#fff7e6;cursor:pointer}
.fleetrow .cur b{font-weight:700}
.fleetrow .cur small{color:#ffb38a}
.shipbadge{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 70% 20%,#3a2a78,#0c1030);flex:none}
/* ---- 动画 ---- */
@keyframes pgRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pgLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pgPush{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes pgBack{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
@keyframes pgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page.in-right{animation:pgRight .26s cubic-bezier(.2,.8,.2,1) both}
.page.in-left{animation:pgLeft .26s cubic-bezier(.2,.8,.2,1) both}
.page.in-push{animation:pgPush .3s cubic-bezier(.2,.8,.2,1) both}
.page.in-back{animation:pgBack .3s cubic-bezier(.2,.8,.2,1) both}
.page.in-fade{animation:pgFade .22s ease-out both}
@keyframes maskIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.4)}}
@keyframes dlgIn{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
.mask{animation:maskIn .22s ease-out both}

// Forest 与番茄钟合并：番茄记录并入 Forest，计时统一由神圣座位负责
if(!S.merged){

}
if(!S.v3){
  S.seats.forEach(function(x){ if(x.name==='Forest开始计时') x.name='Forest番茄钟';

var art=null, mode='loading', pendingTimer=null;

// ---------- 工具 ----------
function toTop(){ var sc=document.getElementById('scroller'); if(sc) sc.scrollTop=0; }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateOf(ms){ var d=new Date(ms); d.setHours(d.getHours()-DAY_START_HOUR); return fmt(d); }
function today(){ return dateOf(Date.now()); }
function addDays(s,n){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return fmt(d); }
function daysBetween(a,b){ var pa=a.split('-'),pb=b.split('-'); return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/864e5); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function slotOf(ms){ var h=new Date(ms).getHours(); return h<DAY_START_HOUR?'e':h<12?'m':h<18?'a':'e'; }
var SLOTN={m:'上午',a:'下午',e:'晚上'};
function mmss(ms){ ms=Math.max(0,ms); var s=Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
var VEH=[[729,'🚀'],[243,'🛩️'],[81,'🚄'],[27,'🚃'],[9,'🚎'],[3,'🚐'],[1,'🚗']];
function veh(n){ var s=''; VEH.forEach(function(v){ var k=v[0]===729?Math.floor(n/729):Math.floor(n/v[0])%3; for(var i=0;i<k;i++) s+=v[1]; }); return s; }

// ---------- 定式树 ----------
function byId(id){ for(var i=0;i<S.nodes.length;i++) if(S.nodes[i].id===id) return S.nodes[i]; return null; }
function kids(pid){ return S.nodes.filter(function(n){return n.parentId===pid;}); }
function subtree(id){ var out=[id]; kids(id).forEach(function(k){ out=out.concat(subtree(k.id)); }); return out; }
function done(date,id){ var v=S.log[date]&&S.log[date][id]; return v===1||v===true; }
function totalDone(id){ var t=0; Object.keys(S.log).forEach(function(d){ var v=S.log[d][id]; if(v===1||v===true) t++; }); return t; }
function paused(date,id){ return !!(S.pauses[date] || (S.pexc && S.pexc[date] && S.pexc[date][id])); }
function pauseReason(date,id){ return S.pauses[date] || (S.pexc && S.pexc[date] && S.pexc[date][id]) || ''; }
function anyPause(date){ return !!(S.pauses[date] || (S.pexc && S.pexc[date] && Object.keys(S.pexc[date]).length)); }
function reserved(date,id){ return !!(S.log[date] && S.log[date][id]==='r'); }
function reserveLeft(id,date){ var m=(date||today()).slice(0,7), used=0; Object.keys(S.log).forEach(function(d){ if(d.slice(0,7)===m && S.log[d][id]==='r') used++; }); Object.keys(S.wres||{}).forEach(function(w){ if(S.wres[w][id] && S.wres[w][id].slice(0,7)===m) used++; }); return Math.max(0,(S.reserve?S.reserve.perMonth:2)-used); }
function streak(n){
  if(isWeekly(n)) return weekStreak(n);
  var d=today(), c=0; if(!done(d,n.id)) d=addDays(d,-1);
  while(daysBetween(n.added,d)>=0){ if(paused(d,n.id)||reserved(d,n.id)){ d=addDays(d,-1); continue; } if(done(d,n.id)){ c++; d=addDays(d,-1);} else break; }
  return c;
}

// ---------- 每周定式 ----------
function isWeekly(n){ return n && n.freq==='week'; }
function wkStart(ds){ var p=ds.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return addDays(ds,-((d.getDay()+6)%7)); }

function judgedFrom(n){ var ws=wkStart(n.added); return n.added===ws?ws:addDays(ws,7); }  // 加入那周不足 7 天，不结算
function weekStreak(n){
  var ws=wkStart(today()), c=0;
  if(!weekMet(n,ws)) ws=addDays(ws,-7);

    if(weekReserved(n,ws)){ ws=addDays(ws,-7); continue; }
    if(weekMet(n,ws)){ c++; ws=addDays(ws,-7); } else break;

  return c;
}
function doneToday(n){ var d=today(); return isWeekly(n)? (done(d,n.id)||weekMet(n,wkStart(d))) : done(d,n.id); }
var WD=['一','二','三','四','五','六','日'];
function weekLine(n,dotsOnly){
  var d=today(), ws=wkStart(d), c=weekCount(n,ws), need=n.perWeek, h='<span class="wd7">';

  h+='</span>'; if(dotsOnly) return h;

var RULES={
  star:['星图','<p>你做的每件事都会变成推力，把飞船往外推。航程攒够就到下一站，翻开一张卡片。</p><p><b>今日航程</b> = 推力 × 速度 × 打捞 × 阻力。</p><p><b>推力</b>：越难开始的事给得越多。当天第一次坐下 20，每坐满一次 10，手动勾一个定式 10，健身开始 30、完成 50，不计时的座位成功一次 15，待办按抗拒程度给 10 / 25 / 50（点"做 5 分钟"先给三成）。每笔推力有三成机会变 2 倍，一成机会变 3 倍。</p><p><b>速度</b>：看累计专注次数。坐得越多，飞船越新越快，一共 17 艘，换了就不会退回去。</p><p><b>打捞</b>：每张稀有卡让航程永久 +2%。清掉待办有机会捞到，越抗拒的事机会越大（15% / 40% / 80%）。当天每日定式全勾、至少坐满一次、没有过期待办，必得一张。</p><p><b>充能</b>：不计时的座位成功一次后，下一次"第一次坐下"的推力翻倍。</p><p><b>阻力</b>：每件过期待办让当天航程少一成，最多三成。已经攒下的航程和卡片不会倒扣。</p><p><b>航线</b>：只能飞往和到过的地方相邻的天体，越往外路越长。一层走完，开下一层。</p>'],
  tree:['定式树','<p>定式是一件小到很难失败、到点就做的事。一天最多加一个：和已有的相关就挂在它下面，全新的领域就开一根新枝。</p><p>有一次没做到，这个定式连同挂在它下面的一起删掉，以后可以从末尾重新加。所以只加有把握的。</p><p><b>应急</b>：每个定式每月有固定几次（默认 2 次）。没做到时用掉一次，连续天数保留；用完再失败才删。</p><p><b>每周定式</b>：周一到周日做够次数就算做到。加入的那一周不结算。</p><p><b>暂停日</b>：事先写好的特殊情形，比如出远门。当天暂停，不算失败。</p><p><b>树上的样子</b>：节点越大，连续得越久（10 天封顶）。每累计做到 30 次，多一颗绕着它转的小行星，断了连续也不会少。</p><p>凌晨 4:00 才算新的一天。</p>'],
  seat:['神圣座位','<p>选一个位置当作神圣座位。坐在别处随意；一坐上它，就用最好的状态专注到计时结束。没把握就别坐。</p><p>每成功一次，纪录 #N 加一。中途刷手机、提前离开，纪录清零，从 #1 重来。</p><p>清零只清当前纪录。累计次数只增不减，飞船不会倒退。</p>'],
  xb:['下必为例','<p>拿不准算不算违规时，只有两条路：</p><p>1. 算违规，纪录清零，从 #1 重来。</p><p>2. 算允许，但以后同样的情况一律允许。</p><p>没有"就这一次"。每个季度可以清空一次已允许的行为。</p>'],
  appt:['线性时延','<p>不想马上开始时，先点"预约"。14 分 30 秒内必须点"即时启动"并坐下，这段时间用来收拾桌子、倒水、做准备。</p><p>超时没启动，按下必为例处理。</p>'],
  pomo:['专注计时与休息','<p>坐上计时的座位就开始倒计时，满了自动记一次。</p><p>每完成一次短休息，每完成几次长休息。时长在"休息时长"里改。</p>'],
  todo:['待办清单','<p>杂事拖着，多半是不知道从哪下手。所以每件待办都要写一个 5 分钟内能做完的第一步，再定一个近的期限。</p><p>点"做 5 分钟"只承诺 5 分钟。到点可以顺手做完，也可以停下，写好下一步。</p><p>过期了三选一：现在做 5 分钟、改期（改过几次会显示），或者承认不做并删掉。</p>']
};

    if(pg.page==='history') h+=pageHistory();
    if(pg.page==='rsv') h+=pageRsv();
    if(pg.page==='backup') h+=pageBackup();
    if(pg.page==='star') h+=pageStar();
    if(pg.page==='more') h+=pageMore();
    if(pg.page==='review') h+=pageReview();
  }else{
    if(nav.tab==='habit') h+=pageHabit();
    if(nav.tab==='tree') h+=pageTree();
    if(nav.tab==='focus') h+=pageFocus();
    if(nav.tab==='stats') h+=pageStats();
    if(nav.tab==='todo') h+=pageTodo();
    if(nav.tab==='gym') h+=pageGym();
  }
  var onStar=(pg&&pg.page==='star')||(!pg&&nav.tab==='stats');
  h='<div class="page'+(navAnim?' in-'+navAnim:'')+(starAnim&&onStar?' star-in':'')+'">'+h+'</div>'; var didAnim=starAnim&&onStar; navAnim=null;
  // 进行中的计时：不在对应页面时显示悬浮提示
  var pillTxt=null;
  if(S.active && !(nav.tab==='focus'&&!pg)){ var st=seatById(S.active.seat); pillTxt='● '+st.name.replace('番茄钟','')+' <span id="pillt">'+mmss(st.timerMin*60000-(Date.now()-S.active.start))+'</span>'; }
  else if(S.pomo.brk && !(nav.tab==='focus'&&!pg)){ pillTxt='● 休息 <span id="pillt">'+mmss(S.pomo.brk.dur-(Date.now()-S.pomo.brk.start))+'</span>'; }
  else if(S.appt.pending && !(nav.tab==='focus'&&!pg)){ pillTxt='● 预约 <span id="pillt">'+mmss(APPT_MS-(Date.now()-S.appt.pending))+'</span>'; }
  if(pillTxt) h+='<button class="pill" data-a="pill">'+pillTxt+'</button>';
  h+='<div class="tabs">'+[['habit','<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>','今天'],['tree','<path d="M12 21v-9"/><path d="M12 12c0-4-2.6-6.5-7-6.5 0 4.4 2.6 6.5 7 6.5z"/><path d="M12 15c0-3.4 2.3-5.5 7-5.5 0 3.6-2.6 5.5-7 5.5z"/>','习惯'],['focus','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>','专注'],['todo','<path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4 18.5l1.5 1.5L8 17.5M11.5 7h8.5M11.5 13h8.5M11.5 19h8.5"/>','待办'],['gym','<path d="M3.5 9.5v5M6.5 7v10M17.5 7v10M20.5 9.5v5M6.5 12h11"/>','健身'],['stats','<path d="M4 20h16"/><path d="M7 20v-6"/><path d="M12 20V6"/><path d="M17 20v-10"/>','统计']].map(function(t){
    return '<button data-a="tab:'+t[0]+'" class="'+(nav.tab===t[0]?'act':'')+'"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+t[1]+'</svg>'+t[2]+'</button>'; }).join('')+'</div>';
  R.innerHTML=h;
  if(didAnim) countUp();
  starCheck();
}

// ---------- 弹窗 ----------
var modalCb=null;
function modal(html,cb){ closeModal(); modalCb=cb||null; var m=document.createElement('div'); m.className='mask'; m.id='mask'; m.innerHTML='<div class="dlg">'+html+'</div>'; document.body.appendChild(m); }
function closeModal(){ var m=document.getElementById('mask'); if(m) m.remove(); }

// ---------- 点击 ----------
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]'); if(!t){ if(ev.target.id==='mask') closeModal(); return; }
  ev.preventDefault();
  var a=t.getAttribute('data-a');
  if(t.closest('#mask') && a.indexOf('sel:')===0){ Array.prototype.forEach.call(t.parentNode.children,function(b){ b.classList.remove('on'); }); t.classList.add('on'); var hd=document.getElementById('tdue'); if(hd) hd.value=a.slice(4); var dr=document.getElementById('dnrow'); if(dr) dr.style.display=a==='sel:3'?'flex':'none'; return; }
  if(t.closest('#mask') && a.indexOf('dr:')===0){ Array.prototype.forEach.call(t.parentNode.children,function(b){ b.classList.remove('on'); }); t.classList.add('on'); document.getElementById('tdr').value=a.slice(3); return; }
  if(t.closest('#mask') && a.indexOf('dn:')===0){ var hn=document.getElementById('tdn'), nv=Math.min(60,Math.max(1,(+hn.value||3)+(+a.slice(3)))); hn.value=nv; document.getElementById('dnv').textContent=nv; document.getElementById('dnsm').textContent=dnSmall(nv); return; }
  if(t.closest('#mask') && (a.indexOf('cx:')===0||a.indexOf('cp:')===0)){
    Array.prototype.forEach.call(t.parentNode.children,function(b){ b.classList.remove('on'); }); t.classList.add('on');
    if(a.indexOf('cx:')===0){ document.getElementById('cpk').innerHTML=pickChips(a.slice(3)); return; }
    var q=a.split(':'), c=COMMON[q[1]][+q[2]], l=gymLast(c[0]), sv=function(id,v){ var el=document.getElementById(id); if(el) el.value=v; };
    sv('en',c[0]); sv('el',c[2]); sv('eh',c[3]); sv('eg',c[1]); if(l&&l.w!=null) sv('ew',l.w);
    return;
  }
  if(t.closest('#mask')){ var cb=modalCb, vals={}; Array.prototype.forEach.call(document.querySelectorAll('#mask input,#mask select'),function(i){vals[i.id]=i.type==='checkbox'?i.checked:i.value;}); closeModal(); if(a!=='close' && cb) cb(a,vals); return; }
  var arg=a.split(':');
  switch(arg[0]){
    case 'tab': if(nav.tab!==arg[1]||nav.stack.length) navAnim=nav.stack.length?'back':(TABORD.indexOf(arg[1])>=TABORD.indexOf(nav.tab)?'right':'left'); nav.tab=arg[1]; nav.stack=[]; render(); toTop(); return;
    case 'push': navAnim='push'; nav.stack.push({page:arg[1],arg:arg[2]}); render(); toTop(); return;
    case 'back': navAnim='back'; nav.stack.pop(); render(); toTop(); return;
    case 'seg': navAnim='fade'; seg[arg[1]]=arg[2]; if(arg[1]==='stats') cal.month=cal.month; render(); return;
    case 'pill': nav.tab='focus'; nav.stack=[]; render(); toTop(); return;
    case 'calm': cal.month=monthAdd(cal.month,+arg[1]); render(); return;
    case 'caly': cal.month=monthAdd(cal.month,12*(+arg[1])); render(); return;
    case 'calto': cal.month=arg[1]; render(); return;
    case 'day': return showDay(arg[1]);
    case 'sc': return starShow(arg[1],arg[2]);
    case 'sgo': if(starReach(tierOf(arg[1])).indexOf(arg[1])>=0 && S.star.target!==arg[1]){ starSetTarget(arg[1]); save(); render(); toast('改飞往 '+stopById(arg[1])[1]); } return;
    case 't': return toggle(arg[1]);
    case 'hd': return habitMore(arg[1]);
    case 'tgym': nav.tab='gym'; nav.stack=[]; return gymStart(arg[1]);
    case 'f': return askFail(arg[1]);
    case 'p': return markPast(arg[1],arg[2]);
    case 'x': return askFail(arg[2],arg[1]);
    case 'pause': return pauseToday();
    case 'unpause': return unpause();
    case 'unp': return unpause(arg[1]);
    case 'fq':
      Array.prototype.forEach.call(t.parentNode.children,function(b){ b.className=''; }); t.className='on';
      document.getElementById('wkopt').style.display=arg[1]==='week'?'block':'none'; return;
    case 'pd': t.classList.toggle('on'); return;
    case 'add':
      var nm=document.getElementById('fn').value.trim(), cr=document.getElementById('fc').value.trim(), pid=document.getElementById('fp').value;
      if(!nm){ document.getElementById('fn').focus(); return; }
      var opt=null;
      if(document.getElementById('wkopt').style.display!=='none'){
        var pw=parseInt(document.getElementById('fw').value,10); if(!(pw>=1&&pw<=7)){ document.getElementById('fw').focus(); return; }
        opt={freq:'week',perWeek:pw,plan:Array.prototype.map.call(document.querySelectorAll('.days button.on'),function(b){ return +b.getAttribute('data-a').slice(3); })};
      }
      var pgA=nav.stack[nav.stack.length-1]; if(pgA&&pgA.arg&&pgA.arg.autoTodo){ opt=opt||{}; opt.autoTodo=true; } if(pgA&&pgA.arg&&pgA.arg.autoGym){ opt=opt||{}; opt.autoGym=true; }
      return addNode(nm,cr,pid,opt);
    case 'gset': return gymSet(+arg[1],+arg[2]);
    case 'gmv': return gymMove(+arg[1],+arg[2]);
    case 'pmv': return planMove(arg[1],+arg[2],+arg[3]);
    case 'gdel': return gymDel(+arg[1]);
    case 'gdnew': return modal('<h3>新训练日</h3><label>名字</label><input id="gn" placeholder="例如：腿日"><div class="row"><button class="btn ghost" data-a="close">取消</button><button class="btn pri" data-a="ok">添加</button></div>',
      function(a2,v){ var nm=(v.gn||'').trim(); if(a2==='ok' && nm){ var id='g'+Date.now().toString(36); S.gym.days.push({id:id,name:nm,ex:[]}); seg.gym=id; save(); render(); } });
    case 'gdren': return (function(){ var dy=gymDay(arg[1]); if(!dy) return; modal('<h3>改名</h3><input id="gn" value="'+esc(dy.name)+'"><div class="row"><button class="btn ghost" data-a="close">取消</button><button class="btn pri" data-a="ok">保存</button></div>',
      function(a2,v){ var nm=(v.gn||'').trim(); if(a2==='ok' && nm){ dy.name=nm; save(); render(); } }); })();
    case 'gddel': return (function(){ var dy=gymDay(arg[1]); if(!dy) return; modal('<h3>删除「'+esc(dy.name)+'」</h3><p>这一天的动作安排一起删除，无法恢复。训练记录保留。</p><div class="row"><button class="btn ghost" data-a="close">取消</button><button class="btn danger" data-a="ok">删除</button></div>',
      function(a2){ if(a2==='ok'){ S.gym.days=S.gym.days.filter(function(x){return x.id!==dy.id;}); S.gym.next=0; seg.gym=null; save(); render(); } }); })();
    case 'gadd': return gymRunAdd();
    case 'bkfile':
      try{ var blob=new Blob([backupText()],{type:'application/json'}), fn='orbit-'+today()+'.json', file=new File([blob],fn,{type:'application/json'});
        if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:fn}).then(function(){ S.lastBackup=today(); save(); render(); toast('已导出'); }).catch(function(){}); }
        else{ var u=URL.createObjectURL(blob), aa=document.createElement('a'); aa.href=u; aa.download=fn; document.body.appendChild(aa); aa.click(); aa.remove(); S.lastBackup=today(); save(); render(); toast('已下载 '+fn); } }catch(e){ toast('导出失败，改用"复制备份文本"'); }
      return;
    case 'bkcopy': try{ navigator.clipboard.writeText(backupText()).then(function(){ S.lastBackup=today(); save(); render(); toast('已复制'); },function(){ toast('复制失败'); }); }catch(e){ toast('复制失败'); } return;
    case 'bkpick': var fi=document.getElementById('bkf'); fi.onchange=function(){ var f=fi.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ doRestore(rd.result); }; rd.readAsText(f); }; fi.click(); return;
    case 'bkpaste': var tv=document.getElementById('bkt').value.trim(); if(tv) doRestore(tv); return;
    case 'gbw': return gymBw();
    case 'gpr': var gd=gymDay(arg[1]); if(gd&&gd.ex[+arg[2]]) gymProgress(gd.ex[+arg[2]].n); return;
    case 'gstart': return gymStart(arg[1]);
    case 'gfin': return gymFinish();
    case 'gab': return gymAbort();
    case 'gex': return gymExForm(arg[1],+arg[2]);
    case 'gymhabit': nav.stack.push({page:'add',arg:{name:'去健身房',criterion:'完成一次训练记录',freq:'week',perWeek:3,autoGym:true}}); render(); toTop(); return;
    case 'tdadd': return todoForm();
    case 'tdok': return todoComplete(arg[1]);
    case 'tdgo': return todoStart(arg[1]);
    case 'tdstop': return todoStop();
    case 'tdmore': return todoMore(arg[1]);
    case 'todohabit': nav.stack.push({page:'add',arg:{name:'清杂事',criterion:'清掉至少一件待办',freq:'week',perWeek:2,autoTodo:true}}); render(); toTop(); return;
    case 'bw': return backfillWeek(arg[2],arg[1]);
    case 'xw': return askFail(arg[2],null,arg[1]);
    case 're':
      var e=S.history[+arg[1]], top=e.snap[0];
      nav.stack.push({page:'add',arg:{name:top.name,criterion:top.criterion,parentId:top.parentId,freq:top.freq,perWeek:top.perWeek,plan:top.plan,autoTodo:top.autoTodo,autoGym:top.autoGym}}); render(); toTop(); return;
    case 'addex': var v=document.getElementById('fe').value.trim(); if(v){ S.exceptions.push(v); save(); render(); } return;
    case 'rmex': S.exceptions.splice(+arg[1],1); save(); render(); return;
    case 'go': return startSeat(arg[1]);
    case 'ok': return seatSuccess(arg[1]);
    case 'v': return arg[1]==='appt'?violation('appt'):violation('seat',arg[1]);
    case 'ap': return apptFire(arg[1]);
    case 'undo': var u=toastUndo; toastUndo=null; var te=document.getElementById('toast'); if(te) te.className=''; if(u) u(); return;
    case 'apgo': return apptGo();
    case 'qclr': return clearQuarter();
    case 'addseat': return addSeat();
    case 'seatdel': return (function(){ var sid=arg[1], st=seatById(sid); if(!st) return;
      modal('<h3>删除「'+esc(st.name)+'」</h3><p>纪录 #'+st.count+' 清零，无法恢复。</p><div class="row"><button class="btn ghost" data-a="close">取消</button><button class="btn danger" data-a="ok">删除</button></div>',
        function(a2){ if(a2==='ok'){ S.seats=S.seats.filter(function(x){return x.id!==sid;}); if(S.active&&S.active.seat===sid) S.active=null; if(S.appt.seat===sid){ S.appt.pending=null; S.appt.seat=null; } hist('删除座位：'+st.name); save(); nav.stack.pop(); render(); } }); })();
    case 'seatsave':
      var st=seatById(arg[1]), nn=document.getElementById('sen').value.trim(), mm=parseInt(document.getElementById('sem').value,10);
      if(nn) st.name=nn; if(!isNaN(mm)&&mm>=0) st.timerMin=mm; save(); nav.stack.pop(); render(); return;
    case 'brk': return breakStart(arg[1]);
    case 'brkend': return breakEnd();
    case 'rsvsave':
      var pm=parseInt(document.getElementById('rpm').value,10);
      if(!isNaN(pm)&&pm>=0) S.reserve.perMonth=pm;
      save(); nav.stack.pop(); render(); return;
    case 'psetsave':
      var P=S.pomo; ['s','l','e'].forEach(function(k){ var val=parseInt(document.getElementById('p'+k).value,10); if(!isNaN(val)&&val>0){ if(k==='e') P.every=val; else P[k]=val; } });
      save(); nav.stack.pop(); render(); return;
  }
});

// ---------- 计时刷新 ----------
var shownDay=null;
function checkDay(){ if(today()!==shownDay){ shownDay=today(); render(); } }
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ if(seatCheck()||breakCheck()) render(); checkDay(); } });
window.addEventListener('focus',checkDay);
window.addEventListener('pageshow',checkDay);
setInterval(checkDay,30000);
setInterval(function(){
  var modalOpen=!!document.getElementById('mask');
  if(seatCheck()||breakCheck()){ if(!modalOpen) render(); return; }
  if(S.appt.pending && APPT_MS-(Date.now()-S.appt.pending)<=0 && !S.appt.timedOut){ S.appt.timedOut=true; beep(); if(!modalOpen) render(); }
  if(S.todoRun){ var tl=TODO_MS-(Date.now()-S.todoRun.start), te=document.getElementById('ttimer'); if(tl<=0 && !S.todoRun.beeped){ S.todoRun.beeped=true; beep(); if(!modalOpen) render(); } else if(te) te.textContent=mmss(tl); }
  var el, run=null;
  if(S.active){ var st=seatById(S.active.seat); run={dur:st.timerMin*60000,start:S.active.start}; }
  else if(S.pomo.brk) run=S.pomo.brk;
  if(run && (el=document.getElementById('ptimer'))){ var lf=run.dur-(Date.now()-run.start); el.textContent=mmss(lf); var ring=document.getElementById('pring'); if(ring){ var c=2*Math.PI*92; ring.setAttribute('stroke-dashoffset',(c*(1-Math.max(0,lf)/run.dur)).toFixed(1)); } }
  if(S.appt.pending && (el=document.getElementById('appt'))) el.textContent=mmss(APPT_MS-(Date.now()-S.appt.pending));
  if(el=document.getElementById('pillt')){
    if(run) el.textContent=mmss(run.dur-(Date.now()-run.start));
    else if(S.appt.pending) el.textContent=mmss(APPT_MS-(Date.now()-S.appt.pending));
  }
},1000);

seatCheck(); breakCheck();
shownDay=today();
render();
if(typeof navScroll==='number' && navScroll){ var sc0=document.getElementById('scroller'); if(sc0) sc0.scrollTop=navScroll; }
document.getElementById('scroller').addEventListener('scroll',function(){ clearTimeout(window.__kn); window.__kn=setTimeout(keepNav,200); });
mode='local';
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
if(!STORE_OK) toast('浏览器不允许保存数据，记录不会被保留');
})();
</script>
